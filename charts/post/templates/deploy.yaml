apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-app
spec:
  replicas: {{ .Values.replicaCount}}
  selector:
    matchLabels:
      app: post-app
  template:
    metadata:
      labels:
        app: post-app
    spec:
      containers:
      - name: posts-ctn
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}" 
        ports:
        - containerPort: {{ .Values.containerPort }}
        resources:
          limits:
            cpu: "200m"
            memory: "64Mi"
        # 1. 컨테이너가 최초로 켜질때 까지만 감시
        startupProbe:
          httpGet:
            path: /health
            post: {{ .Values.containerPort }}
          # 10초간격으로
          periodSeconds: 10
          # 15번까지 헬스체크 시도
          failureThreshold: 15
        # 2. 부팅 완료 이후 데드락 여부 감시( 실패하면 컨테이너를 자동으로 다시 띄워준다 )
        livenessProbe:
          httpGet: 
            path: /health
            port: {{ .Values.containerPort }}
          # startup 이 성공하면 바로 인계받아서 테스트하기 때문에 대기 시간 필요없음
          initialDelaySeconds: 0
          periodSeconds: 10 # 10초마다 감시
        # 3. 트래픽 유입, 차단 여부를 감시 실패하면 컨테이너를 다시띄우는게 아니고 트래픽만 차단
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.containerPort }}
          initialDelaySeconds: 0
          periodSeconds: 5 # 5초마다 감시